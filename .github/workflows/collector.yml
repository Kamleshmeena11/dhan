# Save this file as: .github/workflows/upstox_chart_download.yml in your repo
#
# Runs TWO jobs per trading day because NSE hours (9:15-15:30 IST = 6h15m)
# exceed GitHub-hosted runners' 6-hour-per-job cap. Each job logs in fresh,
# polls every 5 seconds, and appends to the same repo-committed master CSV.

name: Upstox 1s Chart CSV Polling

on:
  schedule:
    - cron: '40 3 * * 1-5'   # 09:10 IST -> morning session start
    - cron: '50 6 * * 1-5'   # 12:20 IST -> afternoon session start
  workflow_dispatch:
    inputs:
      session_end_ist:
        description: 'HH:MM (IST) to stop polling for a manual run'
        required: false
        default: '15:35'

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 200   # ~3h20m, comfortably under the 360-min hard cap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pyotp
          playwright install --with-deps chromium

      - name: Determine session end time
        id: session
        run: |
          # Morning cron (03:40 UTC) -> stop at 12:25 IST
          # Afternoon cron (06:50 UTC) -> stop at 15:35 IST
          # Manual dispatch -> use the provided input
          HOUR_UTC=$(date -u +%H)
          if [ -n "${{ github.event.inputs.session_end_ist }}" ]; then
            END="${{ github.event.inputs.session_end_ist }}"
          elif [ "$HOUR_UTC" -lt 5 ]; then
            END="12:25"
          else
            END="15:35"
          fi
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Run poller
        env:
          UPSTOX_USERNAME: ${{ secrets.UPSTOX_USERNAME }}
          UPSTOX_PASSWORD: ${{ secrets.UPSTOX_PASSWORD }}
          UPSTOX_TOTP_SECRET: ${{ secrets.UPSTOX_TOTP_SECRET }}
          SESSION_END_IST: ${{ steps.session.outputs.end }}
        run: python download_chart_csv.py

      - name: Commit updated master CSVs back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.csv
          git commit -m "1s chart data update $(date -u +%F' '%H:%M)Z" || echo "nothing to commit"
          git pull --rebase
          git push

      - name: Upload as workflow artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstox-1s-csv-${{ github.run_id }}
          path: data/*.csv
          retention-days: 90
